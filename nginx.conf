server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The host's own nginx terminates TLS and sets the real client address.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # add_header is not inherited into a location that sets its own, hence the include in each.
    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets are not fingerprinted, so they get a day rather than a year; pages revalidate so a
    # deploy shows at once.
    location ~* \.(png|jpg|ttf|css)$ {
        expires 1d;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
