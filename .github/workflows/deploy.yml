# Builds the image on GitHub, pushes it to GHCR, then the host's own runner pulls it and restarts
# the container. Triggered by a push to `main` only: a pull request never reaches the self-hosted
# runner, which matters because this repository is PUBLIC.
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-image:
    name: Build and push the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # WHICH MACHINE SERVES THE SITE IS TWO REPOSITORY VARIABLES, as in Sky: `runs-on` would match
      # any idle self-hosted runner if the label were empty, so it is checked here, on a hosted
      # runner, before anything is built.
      - name: The deploy target is named
        env:
          GALA_RUNNER_LABEL: ${{ vars.GALA_RUNNER_LABEL }}
          GALA_DEPLOY_DIR: ${{ vars.GALA_DEPLOY_DIR }}
        run: |
          for v in GALA_RUNNER_LABEL GALA_DEPLOY_DIR; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is not set."; exit 1; fi
          done

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is named after the repository, never spelled out a second time. GHCR wants lower case.
      - name: The image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # `latest` is what the host pulls; the sha tag traces a running container to a tree.
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: [self-hosted, '${{ vars.GALA_RUNNER_LABEL }}']
    needs: build-image
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.GALA_DEPLOY_DIR }}
      COMPOSE: docker compose -f ${{ vars.GALA_DEPLOY_DIR }}/docker-compose.prod.yml --project-directory ${{ vars.GALA_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: The image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Sync the compose file
        run: |
          mkdir -p "$DEPLOY_DIR"
          cp docker-compose.prod.yml "$DEPLOY_DIR/"

      - name: Pull image
        run: $COMPOSE pull

      - name: Deploy
        run: $COMPOSE up -d --remove-orphans

      # The container's own HEALTHCHECK is the verdict, so no port is repeated here.
      - name: Health check
        run: |
          cid=$($COMPOSE ps -q gala)
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" || true)
            if [ "$status" = "healthy" ]; then echo "Gala healthy"; exit 0; fi
            sleep 3
          done
          echo "::error::Container is '$status' after deploy"
          $COMPOSE logs --tail 50
          exit 1

      - name: Cleanup Docker
        run: docker image prune -af --filter 'until=24h' || true
